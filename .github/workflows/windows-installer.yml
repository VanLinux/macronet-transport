name: Instalador Windows completo

on:
  workflow_dispatch:
  push:
    branches: [main, build/windows-installer]
    paths:
      - 'src/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  build:
    name: Construir instalador con Python y SUMO
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/windows/requirements-build.txt
      - name: Instalar dependencias de construcción
        run: |
          python -m pip install -r packaging/windows/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verificar código y pruebas de MacroNet
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preparar recursos y distribución oficial de SUMO
        run: python packaging/windows/prepare.py
      - name: Congelar Python y aplicación
        run: python -m PyInstaller --clean --noconfirm packaging/windows/macronet.spec
      - name: Incluir SUMO, fuentes y licencias
        run: python packaging/windows/prepare.py --stage
      - name: Construir instalador
        run: |
          $version = (Get-Content build/windows/build-info.json -Raw | ConvertFrom-Json).version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 no está disponible en el runner' }
          & $iscc "/DAppVersion=$version" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/installer/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File dist/installer/SHA256SUMS.txt -Encoding ascii
          }
      - name: Conservar instalador
        uses: actions/upload-artifact@v4
        with:
          name: MacroNet-Windows-completo
          path: dist/installer/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Conservar diagnóstico de construcción
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics
          path: |
            build/windows/build-info.json
            build/macronet/warn-macronet.txt
          if-no-files-found: ignore

  installed-test:
    name: Probar instalación y SUMO sin PATH externo
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MacroNet-Windows-completo
          path: installer
      - name: Instalar, calcular, simular y desinstalar
        shell: pwsh
        run: |
          $installer = (Get-ChildItem installer/*.exe).FullName
          ./packaging/windows/test-install.ps1 -Installer $installer
      - name: Conservar resultados de instalación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-installation-results
          path: installation-results/
          if-no-files-found: ignore

  publish:
    name: Publicar instalador para prueba docente
    needs: [build, installed-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build/windows-installer')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MacroNet-Windows-completo
          path: installer
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = fs.readFileSync('pyproject.toml', 'utf8').match(/^version = "([^"]+)"/m)[1];
            const tag = `windows-v${version}-preview.${context.runNumber}`;
            const release = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: context.sha,
              name: `MacroNet ${version} — Windows con SUMO (prueba)`, prerelease: true,
              body: 'Instalador completo para Windows 11 x64. Incluye Python y Eclipse SUMO 1.28.0. No requiere comandos ni instalaciones adicionales. No incluye LaTeX: los informes .tex se pueden compilar en Overleaf. Instalación y simulación verificadas automáticamente con PATH aislado; pendiente la prueba docente en Windows 11. Descargue el archivo terminado en Setup.exe. Esta primera distribución no está firmada digitalmente.'
            });
            for (const file of fs.readdirSync('installer')) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.data.id, name: file,
                data: fs.readFileSync(`installer/${file}`)
              });
            }
            core.summary.addLink('Descargar instalador', release.data.html_url).write();

